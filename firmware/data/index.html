<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RoomRGB</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    overflow-x: hidden;
}

body {
    padding: 20px 10px;
    min-height: 100vh;
    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    margin: 10px 0 25px 0;
    font-size: 26px;
}

/* PANEL */
.panel {
    width: 95%;
    max-width: 520px;

    background: #1b1b1b;
    border-radius: 18px;

    padding: 25px 20px;
    margin: 20px 0;

    box-shadow: 0 6px 20px rgba(0,0,0,0.4);

    display: flex;
    flex-direction: column;
    gap: 25px;
}

h2 {
    margin: 0;
    font-size: 22px;
    color: #00aaff;
}

/* SLIDER GROUP */
.slider-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

/* VALUE ON TOP */
.value {
    font-size: 50px;
    color: #aaa;
}

/* CENTER LABEL */
label {
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    margin: 0;
}

/* SLIDER */
input[type=range] {
    width: 90%;
    height: 55px;
    accent-color: #00aaff;

}

/* BUTTON */
button {
    margin-top: 10px;
    padding: 18px;
    font-size: 18px;

    width: 100%;
    border: none;
    border-radius: 14px;

    background: #00aaff;
    color: white;

    cursor: pointer;
}

button:hover {
    background: #0088cc;
}

input, button {
    touch-action: manipulation;
}
</style>
</head>

<body>

<div class="panel">
    <h2>Settings</h2>

    <div class="slider-group">
        <label>Brightness</label>
        <div class="value" id="brVal">1</div>
        <input type="range" id="brightness" min="0" max="1" step="0.01" value="1">
    </div>

    <div class="slider-group">
        <label>Transition Speed</label>
        <div class="value" id="sVal">1</div>
        <input type="range" id="speed" min="0" max="5" step="0.1" value="1">
    </div>

    <button onclick="sendSettings()">Apply Settings</button>
</div>


<div class="panel">
    <h2>RGB Control</h2>

    <div class="slider-group">
        <label>Red</label>
        <div class="value" id="rVal">255</div>
        <input type="range" id="red" min="0" max="255" value="255">
    </div>

    <div class="slider-group">
        <label>Green</label>
        <div class="value" id="gVal">100</div>
        <input type="range" id="green" min="0" max="255" value="100">
    </div>

    <div class="slider-group">
        <label>Blue</label>
        <div class="value" id="bVal">50</div>
        <input type="range" id="blue" min="0" max="255" value="50">
    </div>

    <div class="slider-group">
        <label>Transition Duration</label>
        <div class="value" id="dVal">1</div>
        <input type="range" id="duration" min="0" max="5" step="0.1" value="1">
    </div>

    <button onclick="sendRGB()">Apply Color</button>
</div>




<script>

    function loadSettings() {

        if (localStorage.getItem("red") !== null) {
            red.value = localStorage.getItem("red");
            green.value = localStorage.getItem("green");
            blue.value = localStorage.getItem("blue");
            duration.value = localStorage.getItem("duration");

            brightness.value = localStorage.getItem("brightness");
            speed.value = localStorage.getItem("speed");
        }

        updateLabels();
    }

    // ---------------- SAVE values ----------------
    function saveSettings() {
        localStorage.setItem("red", red.value);
        localStorage.setItem("green", green.value);
        localStorage.setItem("blue", blue.value);
        localStorage.setItem("duration", duration.value);

        localStorage.setItem("brightness", brightness.value);
        localStorage.setItem("speed", speed.value);
    }


    function updateLabels() {
        rVal.innerText = red.value;
        gVal.innerText = green.value;
        bVal.innerText = blue.value;
        dVal.innerText = duration.value;

        brVal.innerText = brightness.value;
        sVal.innerText = speed.value;
    }


    function bind() {

        const sliders = [red, green, blue, duration, brightness, speed];

        sliders.forEach(slider => {
            slider.oninput = () => {
                updateLabels();
                saveSettings();
            };
        });
    }

    bind();
    loadSettings();

    // ---------------- SEND RGB ----------------
    function sendRGB() {

        const url = `/api/all_leds`
            + `?red=${red.value}`
            + `&green=${green.value}`
            + `&blue=${blue.value}`
            + `&transition_duration=${duration.value}`;

        fetch(url);
    }

    // ---------------- SEND SETTINGS ----------------
    function sendSettings() {

        const url = `/api/setting`
            + `?brightness=${brightness.value}`
            + `&transition_speed=${speed.value}`;

        fetch(url);
    }
</script>




</body>
</html>
